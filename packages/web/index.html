<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" href="/favicon.ico" />
    <!-- iOS 桌面图标（添加到主屏幕时显示） -->
    <link rel="apple-touch-icon" sizes="152x152" href="/FS_apple152.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="filesyncEX" />
    <title>filesyncEX</title>
    <style>
      @font-face {
        font-family: "JetBrains Mono NL Medium";
        src: url("./fonts/JetBrainsMonoNL-Medium.woff2") format("woff2");
        font-display: swap;
      }
      @font-face {
        font-family: "Source Han Serif CN Medium";
        src: url("./fonts/SourceHanSerifCN-Medium.woff2") format("woff2");
        font-display: swap;
      }
      :root {
        --primary: #047878;
        --primary-hover: #137a7f;
        --primary-active: #035c5c;
        --accent: #86cecb;
        --pink: #e12885;
        --warn: #d9a020;
        --danger: #e5484d;
        --ink: #525658;
        --muted: #6f7a82;
        --line: #dde3e7;
        --bg: #ffffff;
        --surface: #f6f8fa;
        --surface-2: #eef2f5;
        --bubble: #f0f6f6;
        --shadow: 0 2px 10px rgba(4, 120, 120, 0.18);
        --radius: 10px;
        --frost-bg: rgba(255, 255, 255, 0.8);
        --frost-line: rgba(255, 255, 255, 0.5);
        --mono: "JetBrains Mono NL Medium", Consolas, "Courier New", monospace;
        --serif: "Source Han Serif CN Medium", "Noto Serif SC", serif;
      }
      html[data-theme="dark"] {
        --primary: #047878;
        --primary-hover: #137a7f;
        --primary-active: #035c5c;
        --accent: #86cecb;
        --pink: #e12885;
        --warn: #d9a020;
        --danger: #e5484d;
        --ink: #bec8d1;
        --muted: #8b98a1;
        --line: #2a313c;
        --bg: #13171f;
        --surface: #1a2029;
        --surface-2: #20262f;
        --bubble: #1d262e;
        --shadow: 0 2px 10px rgba(0, 0, 0, 0.4);
        --frost-bg: rgba(42, 48, 58, 0.85);
        --frost-line: rgba(255, 255, 255, 0.12);
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        background: var(--bg);
      }
      /* 桌面端：窗口小于最小尺寸时允许 body 出现上下/左右滚动条（避免内容被压缩/遮挡） */
      @media (min-width: 641px) {
        html,
        body {
          min-width: 960px;
          min-height: 640px;
        }
      }
      /* 页面滚动条：轨道（背景）透明，仅滑块可见 */
      html {
        scrollbar-width: thin;
        scrollbar-color: rgba(120, 130, 140, 0.35) transparent;
      }
      html::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }
      html::-webkit-scrollbar-track {
        background: transparent;
      }
      html::-webkit-scrollbar-thumb {
        background: rgba(120, 130, 140, 0.35);
        border-radius: 5px;
        border: 2px solid transparent;
        background-clip: content-box;
      }
      * {
        box-sizing: border-box;
      }
    </style>
  </head>
  <body>
    <filesync-app></filesync-app>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
