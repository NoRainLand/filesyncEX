<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0c222b">
  <meta name="description" content="一只夜鹭在月光下骑着自行车，沿湿地小路慢慢向前。纯 SVG 绘制的循环动画。">
  <title>夜骑漫游 · 夜鹭骑自行车</title>
  <style>
    :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; color: #e4eee9; background: #0b1c23; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 32px; background: radial-gradient(ellipse at 50% 30%, #19343c 0, #0b1c23 72%); }
    main { width: min(1200px, calc((100svh - 145px) * 1.6216), 100%); }
    .scene { position: relative; overflow: hidden; border-radius: 22px; border: 1px solid #bedfd51a; box-shadow: 0 32px 100px #0005; isolation: isolate; }
    .art { display: block; width: 100%; height: auto; }
    .heading { position: absolute; z-index: 1; left: 4.5%; top: 6.2%; pointer-events: none; }
    .eyebrow { margin: 0 0 14px; display: flex; align-items: center; gap: 10px; color: #9fbbb7; font-size: 12px; letter-spacing: .25em; }
    .eyebrow::before { content: ""; width: 22px; height: 1px; background: #91afa5; }
    h1 { margin: 0; font-weight: 500; font-size: clamp(23px, 2.6vw, 34px); letter-spacing: .12em; }
    .heading p:last-child { margin: 14px 0 0; font-size: 14px; color: #99b6b3; letter-spacing: .13em; }
    .status { position: absolute; right: 4.5%; bottom: 5.2%; display: flex; align-items: center; gap: 8px; font-size: 12px; letter-spacing: .12em; color: #b6cfc5; }
    .status::before { content: ""; height: 5px; width: 5px; border-radius: 50%; background: #d5e8a6; box-shadow: 0 0 9px #d5e8a670; }
    .status.is-paused::before { background: #8a9e96; box-shadow: none; }
    footer { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 24px 5px 0; }
    .note { margin: 0; font-size: 14px; letter-spacing: .07em; color: #8eaaa9; }
    .controls { display: flex; align-items: center; gap: 18px; flex-shrink: 0; }
    button, select { font: inherit; font-size: 14px; color: #d5e6df; border: 1px solid #78968d44; background: #172f37; border-radius: 100px; min-height: 44px; cursor: pointer; }
    button { display: flex; align-items: center; justify-content: center; gap: 9px; padding: 0 18px; min-width: 96px; }
    button:hover, select:hover { background: #223f46; border-color: #aac2b577; }
    button:focus-visible, select:focus-visible { outline: 2px solid #f2d792; outline-offset: 5px; }
    button svg { width: 15px; height: 15px; }
    .speed-control { display: flex; align-items: center; gap: 10px; font-size: 14px; color: #8eaaa9; }
    select { padding: 0 30px 0 14px; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    @media (max-width: 640px) {
      body { padding: 16px; }
      main { width: 100%; }
      .scene { border-radius: 16px; }
      .art { height: auto; }
      .heading { position: relative; top: auto; left: auto; padding: 26px 24px 0; background: #102b38; }
      .eyebrow { font-size: 11px; margin-bottom: 12px; }
      .heading p:last-child { font-size: 12px; margin-top: 12px; }
      .status { right: 7%; bottom: 6%; }
      footer { flex-direction: column; align-items: center; padding-top: 21px; gap: 18px; }
      .note { font-size: 12px; }
      .controls { width: 100%; justify-content: space-between; gap: 12px; }
    }
  </style>
</head>
<body>
<main aria-label="夜鹭骑自行车动画">
  <section class="scene" aria-labelledby="page-title">
    <header class="heading">
      <p class="eyebrow">月光下的小小旅行</p>
      <h1 id="page-title">夜骑漫游</h1>
      <p>晚风轻轻，车轮慢慢。</p>
    </header>
    <svg class="art" id="landscape" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" role="img" aria-labelledby="art-title art-desc">

          <stop offset="1" stop-color="#3d6660"/>
        </linearGradient>
        <linearGradient id="water" x2="0" y2="1">
          <stop stop-color="#35665f"/>
          <stop offset="1" stop-color="#1f4849"/>

        <linearGradient id="road" x2="0" y2="1">
          <stop stop-color="#284a45"/>
          <stop offset="1" stop-color="#153631"/>

        <linearGradient id="wing-light" x1="0" y1="0" x2="1" y2="1">

          <stop offset="1" stop-color="#748e90"/>
        </linearGradient>
        <linearGradient id="beak" x2="0" y2="1">

          <stop offset=".5" stop-color="#293f42"/>
          <stop offset="1" stop-color="#172d34"/>
        </linearGradient>
        <radialGradient id="lamp-glow" cx="0" cy=".5" r="1">

          <stop offset="1" stop-color="#f4df9d" stop-opacity="0"/>
        </radialGradient>
        <filter id="soft-glow" x="-100%" y="-100%" width="300%" height="300%">

        <g id="star" fill="#d9e9ca"><path d="M0-4 1-1 4 0 1 1 0 4-1 1-4 0-1-1Z"/></g>
        <g id="reed" fill="none" stroke-linecap="round">
          <path d="M0 0 Q-4-31 0-71 M0-17 Q-13-38-24-42 M-1-31 Q12-48 21-49" stroke="currentColor" stroke-width="2.5"/>
          <path d="M0-69 1-87" stroke="currentColor" stroke-width="6"/>

        </g>

          <path d="M9 592h15 M77 656h24 M151 579h9 M209 674h18"/>
        </g>
        <g id="spokes" fill="none" stroke="#91afb0" stroke-width="1.6" opacity=".65">

        </g>
        <g id="wheel">

        </g>

    <span id="status" class="status">夜游中</span>
  </section>
  <footer>
    <p class="note">一只夜鹭，一段不着急的路。</p>
    <div class="controls">
      <label class="speed-control" for="speed">骑行速度
        <select id="speed" aria-label="骑行速度">
          <option value="0.6">悠闲</option>
          <option value="1" selected>轻快</option>
          <option value="1.6">追风</option>
        </select>
      </label>
      <button id="toggle" type="button" aria-label="暂停动画" aria-controls="landscape">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path id="toggle-icon" d="M4 3V13M12 3V13" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>
        <span id="toggle-label">暂停</span>
      </button>
    </div>
  </footer>
  <p class="sr-only" id="announcement" aria-live="polite"></p>
  <noscript><p class="note">启用浏览器的 JavaScript 即可播放骑行动画。</p></noscript>
</main>
<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const elements = Object.fromEntries([
    'rear-spokes', 'front-spokes', 'chainring', 'chain', 'bird-body', 'bird-eye',
    'plume-front', 'plume-back', 'distant-scroll', 'middle-scroll', 'foreground-scroll',
    'road-marks', 'road-grain', 'bike-shadow', 'breeze', 'clouds', 'stars', 'water-lines',
    'near-leg', 'near-leg-outline', 'near-foot', 'near-crank', 'near-pedal',
    'far-leg', 'far-leg-outline', 'far-foot', 'far-crank', 'far-pedal'
  ].map(id => [id, $(id)]));
  const fireflies = [...document.querySelectorAll('[data-firefly]')];
  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
  let playing = !reducedMotion.matches;
  let speed = 1;
  let time = 0;
  let previous = null;
  let frameId = null;
  const TAU = Math.PI * 2;
  const set = (id, attribute, value) => elements[id].setAttribute(attribute, value);
  const point = (x, y) => `${x.toFixed(2)} ${y.toFixed(2)}`;

  // Two-segment inverse kinematics keeps the ankle attached to its pedal.
  // The visible joint bends forward; the thigh root stays inside the feathers.
  function leg(side, angle, bob) {
    const px = 505 + Math.cos(angle) * 29;
    const py = 480 + Math.sin(angle) * 29;
    const hx = side === 'near' ? 479 : 469;
    const hy = 354 + bob;
    const ax = px - 5;
    const ay = py - 5;
    const dx = ax - hx, dy = ay - hy;
    const distance = Math.hypot(dx, dy);
    const upper = 86, lower = 88;
    const along = (upper * upper - lower * lower + distance * distance) / (2 * distance);
    const height = Math.sqrt(Math.max(0, upper * upper - along * along));
    const kx = hx + along * dx / distance + height * dy / distance;
    const ky = hy + along * dy / distance - height * dx / distance;
    const d = `M${point(hx, hy)}L${point(kx, ky)} ${point(ax, ay)}`;
    set(`${side}-leg`, 'd', d);
    set(`${side}-leg-outline`, 'd', d);
    set(`${side}-foot`, 'd', `M${point(ax, ay)}Q${point(px, py - 1)} ${point(px + 13, py - 3)}M${point(px + 1, py - 3)}L${point(px + 9, py + 1)}`);
    set(`${side}-crank`, 'd', `M505 480L${point(px, py)}`);
    set(`${side}-pedal`, 'transform', `translate(${point(px, py)})`);
  }

  function render(t) {
    const phase = t * TAU / 1.8;
    const degrees = phase * 180 / Math.PI;
    const travel = t * 155;
    const bob = Math.sin(phase * 2) * 1.7;
    const wheelDegrees = travel / 86 * 180 / Math.PI;
    set('rear-spokes', 'transform', `rotate(${wheelDegrees})`);
    set('front-spokes', 'transform', `rotate(${wheelDegrees})`);
    set('chainring', 'transform', `translate(505 480) rotate(${degrees})`);
    set('chain', 'stroke-dashoffset', -t * 36);
    set('bird-body', 'transform', `translate(0 ${bob})`);
    leg('far', phase + Math.PI, bob);
    leg('near', phase, bob);
    set('plume-front', 'd', `M521 228Q477 ${240 + Math.sin(t * 3) * 4} 442 ${226 + Math.sin(t * 3 + 1) * 6}Q427 ${219 + Math.sin(t * 3 + 2) * 5} 412 ${224 + Math.sin(t * 3 + 3) * 5}`);
    set('plume-back', 'd', `M518 225Q481 ${223 + Math.sin(t * 3 + 1) * 3} 459 ${206 + Math.sin(t * 3 + 2) * 5}Q446 ${197 + Math.sin(t * 3 + 3) * 5} 425 ${201 + Math.sin(t * 3 + 4) * 5}`);
    const blinkTime = t % 6.7;
    const blink = blinkTime > 5.95 && blinkTime < 6.12 ? Math.max(.08, Math.abs(blinkTime - 6.035) / .085) : 1;
    set('bird-eye', 'transform', `translate(553 236) scale(1 ${blink})`);
    set('distant-scroll', 'transform', `translate(${-((travel * .055) % 1200)} 0)`);
    set('middle-scroll', 'transform', `translate(${-((travel * .32) % 1200)} 0)`);
    set('foreground-scroll', 'transform', `translate(${-((travel * 1.35) % 1200)} 0)`);
    set('road-marks', 'transform', `translate(${-(travel % 193)} 0)`);
    set('road-grain', 'transform', `translate(${-(travel % 240)} 0)`);
    set('bike-shadow', 'rx', 242 + Math.sin(phase * 2) * 2);
    set('breeze', 'transform', `translate(${Math.sin(t * 2) * 8} 0)`);
    set('breeze', 'opacity', .2 + Math.sin(t * 2) * .07);
    set('clouds', 'transform', `translate(${Math.sin(t * .06) * 30} 0)`);
    set('stars', 'opacity', .78 + Math.sin(t * 1.1) * .18);
    set('water-lines', 'transform', `translate(${Math.sin(t * .75) * 5} 0)`);
    fireflies.forEach((fly, i) => {
      fly.setAttribute('transform', `translate(${Math.sin(t * .75 + i * 2) * 13} ${Math.sin(t * 1.15 + i) * 9})`);
      fly.setAttribute('opacity', .3 + (Math.sin(t * 1.8 + i * 2.1) + 1) * .34);
    });
  }

  function frame(now) {
    frameId = null;
    if (!playing || document.hidden) { previous = null; return; }
    if (previous !== null) time += Math.min((now - previous) / 1000, .06) * speed;
    previous = now;
    render(time);
    frameId = requestAnimationFrame(frame);
  }
  function syncPlayback(announce = false) {
    $('toggle-label').textContent = playing ? '暂停' : '播放';
    $('toggle').setAttribute('aria-label', playing ? '暂停动画' : '播放动画');
    $('toggle-icon').setAttribute('d', playing ? 'M4 3V13M12 3V13' : 'M5 3 12 8 5 13Z');
    $('toggle-icon').setAttribute('fill', playing ? 'none' : 'currentColor');
    $('toggle-icon').setAttribute('stroke-width', playing ? '3' : '1.5');
    $('status').textContent = playing ? '夜游中' : '歇一会儿';
    $('status').classList.toggle('is-paused', !playing);
    if (frameId !== null) cancelAnimationFrame(frameId);
    frameId = null;
    previous = null;
    if (playing && !document.hidden) frameId = requestAnimationFrame(frame);
    if (announce) $('announcement').textContent = playing ? '动画已继续播放' : '动画已暂停';
  }
  $('toggle').addEventListener('click', () => { playing = !playing; syncPlayback(true); });
  $('speed').addEventListener('change', event => {
    speed = Number(event.target.value);
    $('announcement').textContent = `骑行速度：${event.target.selectedOptions[0].textContent}`;
  });
  document.addEventListener('visibilitychange', () => syncPlayback());
  reducedMotion.addEventListener('change', event => {
    if (event.matches) { playing = false; syncPlayback(true); }
  });
  // Mobile uses a tighter viewBox so the rider stays legible without clipping.
  const mobile = window.matchMedia('(max-width: 640px)');
  const resize = () => $('landscape').setAttribute('viewBox', mobile.matches ? '205 0 810 740' : '0 0 1200 740');
  mobile.addEventListener('change', resize);
  resize();
  render(0);
  syncPlayback();
})();
</script>
</body>
</html>
