name: CI

# 构建（tsc/vite） + 测试。Node 18 = 打包目标版本，也是 better-sqlite3 预编译 .node 的 ABI。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: pnpm

      - name: 安装依赖（frozen lockfile）
        run: pnpm install --frozen-lockfile

      - name: 构建全部包（tsc + vite）
        run: pnpm build

      - name: 运行测试（Node 内置断言 + 进程内 runner）
        run: pnpm --filter @filesyncex/server test
